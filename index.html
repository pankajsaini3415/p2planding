<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>USDT.P2P · trade instant</title>
  <!-- Font Awesome 6 (free) for icons: replaces Feather + MaterialCommunityIcons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #FFFFFF;
      --panel: #F8FAFC;
      --panel-soft: #F1F5F9;
      --border: #E2E8F0;
      --text: #0F172A;
      --muted: #64748B;
      --primary: #2563EB;
      --success: #10B981;
      --shadow-color: rgba(15, 23, 42, 0.07);
      --card-radius: 28px;
      --card-radius-mobile: 20px;
      --transition: all 0.2s ease;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin: 0;
    }

    /* main container */
    .container {
      width: 100%;
      max-width: 980px;
      margin: auto;
    }

    /* animated card — entrance animation */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 28px;
      box-shadow: 0 12px 26px var(--shadow-color);
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      justify-content: space-between;
      min-height: 620px; /* base, adapts with content + media */
      animation: cardEntrance 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      transform-origin: center;
    }

    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: translateY(26px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* mobile card adjustments */
    @media (max-width: 767px) {
      .card {
        border-radius: var(--card-radius-mobile);
        padding: 18px;
        gap: 12px;
        min-height: 520px;
      }
    }

    /* top row */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    @media (max-width: 767px) {
      .top-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    .brand {
      font-size: 25px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    /* rate pill with pulse animation */
    .rate-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      animation: pulseScale 2.4s infinite ease-in-out;
      transform-origin: center;
    }

    @keyframes pulseScale {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .rate-pill i {
      color: var(--success);
      font-size: 14px;
    }

    .rate-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    /* title */
    .title {
      font-size: 42px;
      line-height: 1.15;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    @media (max-width: 767px) {
      .title {
        font-size: 30px;
        line-height: 1.2;
      }
    }

    .subtitle {
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
      margin-top: -4px;
    }

    /* payment methods chips */
    .method-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 8px 0 8px 0;
    }

    .method-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      transition: var(--transition);
    }

    .method-chip i {
      color: var(--primary);
      font-size: 14px;
    }

    .method-chip span {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    /* subtle hover effect on chips (enhance) */
    .method-chip:hover {
      background: #e9eef3;
      border-color: #cbd5e1;
    }

    /* telegram button — with press & slight hover lift */
    .telegram-btn {
      align-self: flex-start;
      margin-top: 4px;
      background: var(--primary);
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.18s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      cursor: pointer;
      border: 1px solid transparent;
      /* subtle floating animation (like original translateY pulse) */
      animation: floatSoft 2.4s infinite ease-in-out;
    }

    .telegram-btn i {
      font-size: 18px;
    }

    @keyframes floatSoft {
      0% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
      100% { transform: translateY(0); }
    }

    .telegram-btn:hover {
      background: #1d4ed8;
      transform: scale(1.02) translateY(-2px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }

    .telegram-btn:active {
      transform: scale(0.98) translateY(0);
      background: #1e3fb0;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    /* footer */
    .footer-note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* tiny extra glow for rate pill */
    .rate-pill {
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.08);
    }

    /* improve mobile tap targets */
    @media (max-width: 480px) {
      .telegram-btn {
        padding: 14px 24px;
        width: 100%;
        justify-content: center;
      }
      .method-chip {
        padding: 8px 12px;
      }
    }

    /* smooth transitions for all interactive */
    a, button, .method-chip {
      -webkit-tap-highlight-color: transparent;
    }

    /* align icons in button */
    .telegram-btn i.fa-telegram {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- main card -->
    <div class="card" id="mainCard">
      <!-- top row with brand and rate pill -->
      <div class="top-row">
        <span class="brand">USDT.P2P</span>
        <div class="rate-pill">
          <i class="fas fa-chart-line"></i> <!-- replaces Feather activity -->
          <span class="rate-text">USDT ₹105.00</span>
        </div>
      </div>

      <!-- headings -->
      <h1 class="title">Trade USDT Fast & Secure</h1>
      <p class="subtitle">All payment methods available.</p>

      <!-- payment chips -->
      <div class="method-wrap">
        <div class="method-chip"><i class="fas fa-check-circle"></i><span>UPI</span></div>
        <div class="method-chip"><i class="fas fa-check-circle"></i><span>Net Banking</span></div>
        <div class="method-chip"><i class="fas fa-check-circle"></i><span>IMPS</span></div>
        <div class="method-chip"><i class="fas fa-check-circle"></i><span>RTGS</span></div>
        <div class="method-chip"><i class="fas fa-check-circle"></i><span>CDM</span></div>
      </div>

      <!-- telegram CTA button (actual link) -->
      <a href="#" class="telegram-btn" id="telegramLink">
        <i class="fab fa-telegram-plane"></i>
        <span>Chat on Telegram</span>
      </a>

      <!-- footer -->
      <div class="footer-note">
        Instant support • Verified deals • White theme premium UX
      </div>
    </div>
  </div>

  <!-- small script to set dynamic Telegram link with pre-filled message -->
  <script>
    (function() {
      const TELEGRAM_USERNAME = "Prongtoken";          // from original
      const USDT_RATE_INR = "105.00";                  // constant
      const message = `Hi @${TELEGRAM_USERNAME}, I want to buy/sell USDT at ₹${USDT_RATE_INR}`;
      const encodedMessage = encodeURIComponent(message);
      const telegramUrl = `https://t.me/${TELEGRAM_USERNAME}?text=${encodedMessage}`;

      // find the telegram button and set href
      const telegramBtn = document.getElementById('telegramLink');
      if (telegramBtn) {
        telegramBtn.href = telegramUrl;
        telegramBtn.setAttribute('target', '_blank');  // open in new tab (safe)
        telegramBtn.setAttribute('rel', 'noopener noreferrer');
      }

      // optional: you can also add a small extra entrance enhancement
      // but card already uses css animation

      // optionally adjust min-height based on window height? not necessary, but we keep original spirit
      // the original used useWindowDimensions to set card minHeight.
      // we replicate the same logic to adjust card height dynamically (purely cosmetic)
      function adjustCardMinHeight() {
        const card = document.getElementById('mainCard');
        if (!card) return;
        const width = window.innerWidth;
        const height = window.innerHeight;
        const isMobile = width < 768;
        // compute minHeight like original: round(max(height * (isMobile ? 0.76 : 0.78), isMobile ? 520 : 620))
        let minHeight = Math.round(Math.max(height * (isMobile ? 0.76 : 0.78), isMobile ? 520 : 620));
        // but also ensure it's not too small: we apply style directly
        card.style.minHeight = minHeight + 'px';
      }

      // call once and on resize (optional)
      adjustCardMinHeight();
      window.addEventListener('resize', () => {
        adjustCardMinHeight();
      });
    })();
  </script>
  <!-- no extra dependencies — clean, simple, enhanced UI -->
</body>
</html>
