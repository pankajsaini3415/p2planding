<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>USDT.P2P · instant & secure</title>
  <!-- Font Awesome 6 (free) for crisp icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- CSS reset & global ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Design system — soft light palette with premium feel */
    :root {
      --bg-start: #f9fcff;        /* very light gradient start */
      --bg-end: #f0f5fd;          /* subtle blueish end */
      --card-bg: rgba(255,255,255,0.9);
      --card-border: rgba(226, 232, 240, 0.5);
      --text-primary: #0b1e38;    /* deep navy for headings */
      --text-secondary: #2d4059;   /* soft navy for secondary */
      --text-muted: #62748c;       /* elegant muted */
      --primary: #2266cc;          /* rich but soft blue */
      --primary-light: #d9e6ff;
      --success: #10b981;          /* fresh green */
      --success-light: #d1fae5;
      --chip-bg: #ffffff;
      --chip-border: #e4eaf2;
      --shadow-sm: 0 10px 30px -8px rgba(0,20,40,0.1), 0 2px 8px -4px rgba(0,20,40,0.02);
      --shadow-md: 0 20px 40px -12px rgba(0,34,64,0.18), 0 8px 24px -8px rgba(0,34,64,0.1);
      --shadow-glow: 0 0 0 1px rgba(34,102,204,0.1), 0 20px 40px -12px rgba(0,34,64,0.18);
      --radius-card: 36px;
      --radius-pill: 60px;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin: 0;
      /* soft noise texture (subtle) */
      background-image: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.4) 0%, transparent 30%),
                        radial-gradient(circle at 70% 60%, rgba(210,230,255,0.5) 0%, transparent 40%);
    }

    /* main container – exactly fits view, no scroll */
    .container {
      width: 100%;
      max-width: 1040px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ----- card design with glass-like clarity ----- */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(2px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      padding: 2.5rem;
      box-shadow: var(--shadow-md);
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      transition: box-shadow 0.3s ease;
      animation: cardFloatIn 0.8s cubic-bezier(0.15, 0.85, 0.35, 1.05) forwards;
      transform-origin: center;
      max-width: 880px;         /* keeps it cozy on large screens */
      margin: 0 auto;
    }

    .card:hover {
      box-shadow: var(--shadow-glow);
    }

    @keyframes cardFloatIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* every direct child gets a subtle staggered fade */
    .card > * {
      animation: fadeUp 0.5s ease forwards;
      opacity: 0;
      animation-delay: calc(0.08s * var(--i, 1));
    }

    /* assign indexes manually via style or rely on nth-child */
    .card > :nth-child(1) { --i: 1; }
    .card > :nth-child(2) { --i: 2; }
    .card > :nth-child(3) { --i: 3; }
    .card > :nth-child(4) { --i: 4; }
    .card > :nth-child(5) { --i: 5; }
    .card > :nth-child(6) { --i: 6; }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* top row: brand + pill */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #142b44, #1d3b5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
    }

    .brand::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 40px;
      height: 3px;
      background: var(--primary);
      border-radius: 4px;
      opacity: 0.3;
    }

    /* rate pill — elegant pulse + shine */
    .rate-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      border: 1px solid rgba(16,185,129,0.2);
      border-radius: var(--radius-pill);
      padding: 10px 18px;
      box-shadow: 0 4px 12px rgba(16,185,129,0.08);
      animation: softPulse 3s infinite ease-in-out;
    }

    @keyframes softPulse {
      0% { box-shadow: 0 4px 12px rgba(16,185,129,0.08); transform: scale(1); }
      50% { box-shadow: 0 8px 20px rgba(16,185,129,0.18); transform: scale(1.02); }
      100% { box-shadow: 0 4px 12px rgba(16,185,129,0.08); transform: scale(1); }
    }

    .rate-pill i {
      color: var(--success);
      font-size: 1.1rem;
      filter: drop-shadow(0 2px 4px rgba(16,185,129,0.3));
    }

    .rate-text {
      font-weight: 700;
      font-size: 1rem;
      color: #0b2e26;
      letter-spacing: -0.01em;
    }

    /* main heading */
    .title {
      font-size: 3.4rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-top: 0.2rem;
      max-width: 700px;
    }

    .subtitle {
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: -0.2rem;
      border-left: 4px solid var(--primary-light);
      padding-left: 1rem;
    }

    /* payment method chips — interactive, modern */
    .method-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 0.5rem 0 0.8rem;
    }

    .method-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 60px;
      padding: 10px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
      cursor: default;
      backdrop-filter: blur(2px);
    }

    .method-chip i {
      color: var(--primary);
      font-size: 1rem;
      transition: transform 0.15s ease;
    }

    .method-chip:hover {
      background: white;
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 16px 24px -12px rgba(34,102,204,0.28);
    }

    .method-chip:hover i {
      transform: scale(1.2);
      color: var(--primary);
    }

    /* telegram button — premium feel with lift & glow */
    .telegram-btn {
      align-self: flex-start;
      background: linear-gradient(115deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 80px;
      padding: 16px 32px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 20px 30px -12px #1e3a8a80, 0 4px 12px rgba(0,0,0,0.05);
      transition: all 0.25s ease;
      animation: floatGentle 3.5s infinite alternate;
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      letter-spacing: 0.3px;
    }

    @keyframes floatGentle {
      0% { transform: translateY(0); box-shadow: 0 20px 30px -12px #1e3a8a80; }
      100% { transform: translateY(-4px); box-shadow: 0 28px 40px -12px #1e3f8ac0; }
    }

    .telegram-btn i {
      font-size: 1.6rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .telegram-btn:hover {
      background: linear-gradient(115deg, #1d4ed8, #1e3a8a);
      transform: scale(1.02) translateY(-2px);
      box-shadow: 0 30px 40px -16px #0f2b62;
    }

    .telegram-btn:active {
      transform: scale(0.98) translateY(2px);
      box-shadow: 0 10px 18px -10px #0f2b62;
      transition: 0.05s;
    }

    /* footer — extra refined */
    .footer-note {
      margin-top: 0.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px dashed rgba(100,116,139,0.2);
      padding-top: 1rem;
    }

    .footer-note i {
      color: var(--primary);
      opacity: 0.8;
      font-size: 0.8rem;
    }

    /* responsive adjustments — no scrolling ever */
    @media (max-width: 700px) {
      .card {
        padding: 1.8rem;
        border-radius: 28px;
      }
      .title {
        font-size: 2.5rem;
      }
      .subtitle {
        font-size: 1rem;
      }
      .telegram-btn {
        padding: 14px 28px;
        font-size: 1rem;
      }
      .brand {
        font-size: 1.6rem;
      }
    }

    @media (max-width: 480px) {
      .top-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .method-chip {
        padding: 8px 16px;
      }
      .telegram-btn {
        width: 100%;
        justify-content: center;
      }
    }

    /* small decorative elements — extra depth (no extra content) */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-card);
      padding: 2px;
      background: linear-gradient(145deg, rgba(255,255,255,0.5), rgba(226,232,240,0.2));
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* optional subtle floating bg */
    .container {
      position: relative;
    }

    .container::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle at 30% 40%, rgba(34,102,204,0.03), transparent 60%);
      border-radius: 50%;
      z-index: -1;
      bottom: -10%;
      right: -5%;
    }

    .container::before {
      content: '';
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle at 70% 80%, rgba(16,185,129,0.03), transparent 70%);
      border-radius: 50%;
      z-index: -1;
      top: -10%;
      left: -5%;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- main card with micro-interactions -->
    <div class="card" id="mainCard">
      <!-- top row -->
      <div class="top-row">
        <span class="brand">USDT.P2P</span>
        <div class="rate-pill">
          <i class="fas fa-chart-line"></i>
          <span class="rate-text">USDT ₹105.00</span>
        </div>
      </div>

      <!-- headlines -->
      <h1 class="title">Trade USDT <br>Fast & Secure</h1>
      <p class="subtitle">All payment methods available.</p>

      <!-- payment chips (exactly 5) -->
      <div class="method-wrap">
        <div class="method-chip"><i class="fas fa-check-circle"></i><span>UPI</span></div>
        <div class="method-chip"><i class="fas fa-check-circle"></i><span>Net Banking</span></div>
        <div class="method-chip"><i class="fas fa-check-circle"></i><span>IMPS</span></div>
        <div class="method-chip"><i class="fas fa-check-circle"></i><span>RTGS</span></div>
        <div class="method-chip"><i class="fas fa-check-circle"></i><span>CDM</span></div>
      </div>

      <!-- telegram CTA (opens chat) -->
      <a href="#" class="telegram-btn" id="telegramLink" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-telegram-plane"></i>
        <span>Chat on Telegram</span>
      </a>

      <!-- footer note -->
      <div class="footer-note">
        <i class="fas fa-shield-alt"></i>
        <span>Instant support • Verified deals • White theme premium UX</span>
      </div>
    </div>
  </div>

  <!-- minimal script: set telegram href and ensure no scroll -->
  <script>
    (function() {
      const USERNAME = "Prongtoken";
      const RATE = "105.00";
      const message = `Hi @${USERNAME}, I want to buy/sell USDT at ₹${RATE}`;
      const encoded = encodeURIComponent(message);
      const telegramUrl = `https://t.me/${USERNAME}?text=${encoded}`;

      const link = document.getElementById('telegramLink');
      if (link) {
        link.href = telegramUrl;
      }

      // guarantee that body never overflows (already fine, but double-check)
      document.body.style.overflow = 'hidden';
      window.addEventListener('resize', () => {
        // keep no scroll: height always fits, but ensure body doesn't scroll
        document.body.style.overflow = 'hidden';
      });

      // optional: set min-height of card based on viewport? 
      // already content fits perfectly without scroll because we use flex.
      // but ensure card doesn't exceed viewport height (rare)
      function adjustCardHeight() {
        const vh = window.innerHeight;
        const card = document.querySelector('.card');
        if (!card) return;
        // if card content is taller than viewport - padding, we could reduce padding, but not needed.
        // fallback: if card height > vh-20, we shrink a bit, but unlikely with this content.
        if (card.offsetHeight > vh - 20) {
          card.style.padding = '1.5rem';  // shrink padding slightly
        } else {
          card.style.padding = ''; // revert to default (2.5rem)
        }
      }
      window.addEventListener('load', adjustCardHeight);
      window.addEventListener('resize', adjustCardHeight);
    })();
  </script>

  <!-- No extra content – clean, minimal, ultra-premium -->
</body>
</html>
